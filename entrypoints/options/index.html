<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Talk Copilot の設定</title>
    <style>
      body { max-width: 480px; padding: 16px; font-family: sans-serif; }
      label { display: block; margin-bottom: 12px; }
      input { display: block; width: 100%; padding: 6px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <h1>AWS のアクセスキー</h1>
    <form id="credentials">
      <label>
        アクセスキー ID
        <input name="accessKeyId" required autocomplete="off" />
      </label>
      <label>
        シークレットアクセスキー
        <input name="secretAccessKey" type="password" required autocomplete="off" />
      </label>
      <button type="submit">保存</button>
      <span id="status"></span>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
